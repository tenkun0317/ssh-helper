[package]
name = "ssh-helper"
version = "0.3.0"
edition = "2021"
description = "One-command CLI to register, verify, and revoke SSH public keys (Rust rewrite of the shell/PowerShell version)"
license = "MIT"

[[bin]]
name = "ssh-helper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "wrap_help", "unicode"] }
clap_complete = "4"
anyhow = "1"
chrono = "0.4"
colored = "3"
dialoguer = "0.11"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tempfile = "3"
